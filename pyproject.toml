[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "bcopt"
version = "0.1.0"
description = "Bias-corrected preconditioned optimization (AdamW, Sophia-G, Shampoo)."
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Nikhil Nayak", email = "nikhilnayak268@gmail.com" }]
license = { text = "Apache-2.0" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.1",
    "transformers>=4.40",
    "datasets>=2.18",
    "numpy>=1.24",
    "matplotlib>=3.7",
]

[project.urls]
Repository = "https://github.com/fastino-ai/preconditioner-bias-correction"

[tool.setuptools.packages.find]
where = ["src"]
include = ["bcopt*"]
